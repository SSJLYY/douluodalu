name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 后端：Spring Boot 3.2 + Kotlin，单元测试基于 H2 内存库，无需 MySQL 服务
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        env:
          JWT_SECRET: ci-only-secret-key-at-least-32-bytes-long
        run: mvn -B test

  # 前端：Next.js 16，build 脚本已固定 --webpack（中文路径下 Turbopack 会 panic）
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # 注意：仓库根部的 Gradle 工程（Android app/ + shared/）不在 CI 中构建——
  # Android 端为独立的本地存档客户端，与 Web 前后端无关，暂无自动化测试。
