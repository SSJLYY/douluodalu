# Grafana 数据源自动配置：启动即注册 Prometheus，无需手工添加
# url 指向 compose 网络内的 prometheus 服务名
apiVersion: 1

datasources:
  - name: Prometheus
    uid: douluo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
