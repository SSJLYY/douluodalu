# 测试环境配置
spring:
  datasource:
    url: jdbc:h2:mem:douluo_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long-for-hs256
  expiration: 3600000
  blacklist:
    expiration: 600000

ratelimit:
  enabled: false

# 关闭审计清理调度（SchedulingConfig / AuditLogCleanupService 整 Bean 不注册），
# 防止定时任务在测试运行期间触发造成抖动
audit:
  cleanup-enabled: false

logging:
  level:
    com.douluodalu.game: DEBUG
