# ==================== 生产环境 profile（SPRING_PROFILES_ACTIVE=prod）====================
# 与 application.yml 叠加，仅覆盖生产加固项。

# 1) 彻底关闭 API 文档：/v3/api-docs、/swagger-ui.html 返回 404；
#    SecurityConfig 检测到 springdoc.api-docs.enabled=false 后不再匿名放行文档路径
#    （即使有人再手工开启，路径也落在 anyRequest().authenticated() 之内）。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 2) Actuator 生产暴露清单：仅 health（存活探针，供负载均衡/容器探活）。
#    info 也不暴露；metrics/env/beans/configprops 等保持默认关闭。
#    health 对外仅返回 {"status":"UP"} 级别信息，不泄露 DB/组件明细。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# 3) Prometheus 指标生产双保险：SecurityConfig 检测到本开关为 false 后
#    不再匿名放行 /actuator/prometheus（exposure 亦已不含 prometheus，
#    端点本身不下发）。如需内网抓取，改回 true 并配合反代 ACL 限制来源。
app:
  monitoring:
    prometheus-public: false

# 4) WebSocket 允许来源收敛（第二十八轮，照 CORS_ORIGINS 环境变量先例）：
#    WebSocketConfig 两端点（/ws、/ws-native）读环境变量 WS_ALLOWED_ORIGINS
#    （逗号分隔），缺省 "*" 保持向后兼容。生产部署务必设置环境变量覆盖为真实
#    域名（不要写通配符），示例：
#      WS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
#    （本文件不设该键——来源是部署环境属性而非应用配置，由启动环境注入）

