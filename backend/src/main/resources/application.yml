# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== 数据库配置 ====================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:douluo_game}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true&connectTimeout=5000&socketTimeout=30000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# ==================== Flyway 数据库迁移 ====================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# ==================== JWT 配置 ====================
jwt:
  # 必须 >= 32 字节（256 bit），启动时会校验
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
  expiration: ${JWT_EXPIRATION:86400000}
  blacklist:
    expiration: ${JWT_BLACKLIST_EXPIRATION:3600000}

# ==================== 速率限制 ====================
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  auth:
    requests-per-minute: ${AUTH_RPM:10}
  global:
    requests-per-minute: ${GLOBAL_RPM:300}

# ==================== 游戏配置 ====================
game:
  offline:
    max-hours: 12
    efficiency: 0.8

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.douluodalu.game: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}

# ==================== Springdoc OpenAPI ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
