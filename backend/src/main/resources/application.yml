# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== 数据库配置 ====================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:douluo_game}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true&connectTimeout=5000&socketTimeout=30000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# ==================== Flyway 数据库迁移 ====================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# ==================== JWT 配置 ====================
jwt:
  # 必须 >= 32 字节（256 bit），启动时会校验
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
  expiration: ${JWT_EXPIRATION:86400000}
  blacklist:
    expiration: ${JWT_BLACKLIST_EXPIRATION:3600000}

# ==================== 速率限制 ====================
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  auth:
    requests-per-minute: ${AUTH_RPM:10}
  global:
    requests-per-minute: ${GLOBAL_RPM:300}

# ==================== 读缓存（任务#29） ====================
# 排行榜 Caffeine 缓存。enabled=false 时 CacheConfig 整体不注册（@EnableCaching 随
# 之消失），所有 @Cacheable/@CacheEvict 惰化为直查数据库 —— 一键关闭开关，
# 与 ratelimit.enabled 同款风格。ttl-seconds 为写入后自动过期兜底；
# 分数写路径（breakthrough/towerBattle）另有主动 @CacheEvict。
cache:
  rank:
    enabled: ${CACHE_RANK_ENABLED:true}
    ttl-seconds: ${CACHE_RANK_TTL_SECONDS:30}

# ==================== 游戏配置 ====================
game:
  offline:
    max-hours: 12
    efficiency: 0.8

# ==================== 审计日志保留策略 ====================
audit:
  # 保留天数：清理任务每日凌晨删除 created_at 早于 N 天前的记录；<=0 表示永久保留
  retention-days: ${AUDIT_RETENTION_DAYS:30}
  # 清理任务开关（含 @EnableScheduling）。默认开；application-test.yml 显式关闭，
  # 保证测试 profile 下调度器不启动、不引入抖动
  cleanup-enabled: ${AUDIT_CLEANUP_ENABLED:true}
  # 每日 03:00 执行（避开 00:00 整点高峰）
  cleanup-cron: "0 0 3 * * ?"

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.douluodalu.game: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}

# ==================== Springdoc OpenAPI ====================
# 默认（dev/联调）开启并匿名可访问；生产由 application-prod.yml 关闭
# （SecurityConfig 中文档路径的放行与本开关联动）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ==================== Actuator 监控端点 ====================
# 显式暴露清单：Web 层仅开放 health（存活探针，SecurityConfig 已放行）与 info；
# env/beans/configprops/mappings/heapdump/threats 等敏感端点一律不暴露
# （Spring Boot 3 默认也仅暴露 health，此处写明以防升级后默认值变化）。
# health 详情默认不脱敏展示给未认证请求（when_authorized：仅认证后可见 db 明细）。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  info:
    env:
      enabled: false
